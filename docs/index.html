<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de las webs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2334c759'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--ok:#34c759;--bad:#ff3b30;--warn:#ff9f0a;--none:#d1d1d6}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--none:#3a3a3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.sum{display:flex;align-items:center;gap:10px;margin:18px 0 22px;padding:16px 18px;border-radius:14px;background:var(--card);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--none)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 22%,transparent)}
.muted{color:var(--muted);font-size:13px;font-weight:400}
.site{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top a{color:inherit;text-decoration:none;font-weight:600}
.top a:hover{text-decoration:underline}
.stats{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--muted)}
.stats b{color:var(--text);font-weight:600}
.bars{display:flex;gap:2px;margin:12px 0 6px;height:30px}
.bars i{flex:1;border-radius:3px;background:var(--none);min-width:2px}
.bars i.ok{background:var(--ok)}.bars i.mid{background:var(--warn)}.bars i.bad{background:var(--bad)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.inc{margin-top:8px;font-size:13px;color:var(--muted)}
.inc b{color:var(--bad);font-weight:600}
.warn{color:var(--warn)}
footer{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:560px){.stats{margin-left:0;width:100%;gap:12px}.bars{height:26px}.bars i:nth-child(-n+30){display:none}.axis .d90{display:none}}
@media (min-width:561px){.axis .d60{display:none}}
</style>
</head>
<body>
<main>
<h1>Estado de las webs</h1>
<div class="muted" id="upd">Cargando…</div>
<div class="sum" id="sum"><span class="dot"></span><span>Comprobando…</span></div>
<div id="list"></div>
<footer>Se comprueba cada 5 minutos desde GitHub Actions · historial de 90 días</footer>
</main>
<script>
(function(){
  var repo = location.hostname.split('.')[0], name = location.pathname.split('/').filter(Boolean)[0] || 'monitor-webs';
  var src = 'https://raw.githubusercontent.com/' + repo + '/' + name + '/datos/data.json';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function ago(t){var m=Math.round((Date.now()/1000-t)/60);return m<1?'hace un momento':m<60?'hace '+m+' min':m<1440?'hace '+Math.round(m/60)+' h':'hace '+Math.round(m/1440)+' d';}
  function date(t){return new Date(t*1000).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
  function dur(s){var m=Math.max(1,Math.round(s/60));return m<60?m+' min':m<1440?Math.floor(m/60)+' h '+(m%60)+' min':Math.floor(m/1440)+' d '+Math.floor(m%1440/60)+' h';}
  function pct(days,n){var a=0,b=0;days.slice(-n).forEach(function(d){a+=d.ok;b+=d.n;});return b?(a/b*100):null;}
  function fmtPct(p){return p==null?'—':(p>=99.995?'100':p.toFixed(2).replace('.',','))+' %';}
  function render(data){
    var urls = data.order || Object.keys(data.sites), down = 0, html = '';
    urls.forEach(function(u){
      var s = data.sites[u]; if(!s) return;
      if(!s.up) down++;
      var map = {}; (s.days||[]).forEach(function(d){map[d.d]=d;});
      var bars = '';
      for(var i=89;i>=0;i--){
        var day = new Date(Date.now()-i*864e5), k = day.toLocaleDateString('en-CA',{timeZone:'America/Havana'}), d = map[k];
        var cls = '', tip = day.toLocaleDateString('es',{day:'numeric',month:'short'})+': sin datos';
        if(d && d.n){var p=d.ok/d.n*100;cls=p>=99.5?'ok':p>=95?'mid':'bad';tip=day.toLocaleDateString('es',{day:'numeric',month:'short'})+': '+fmtPct(p)+(d.ok?' · '+Math.round(d.ms/d.ok)+' ms':'');}
        bars += '<i class="'+cls+'" title="'+tip+'"></i>';
      }
      var inc = (s.incidents||[]).slice(-3).reverse().map(function(x){
        return x.end ? 'Caída el '+date(x.start)+' durante '+dur(x.end-x.start) : '<b>Caída desde '+date(x.start)+'</b> ('+esc(x.reason)+')';
      }).join('<br>');
      var ssl = s.ssl_days!=null ? '<span'+(s.ssl_days<=14?' class="warn"':'')+'>SSL <b>'+s.ssl_days+' d</b></span>' : '';
      html += '<div class="site"><div class="top"><span class="dot '+(s.up?'ok':'bad')+'"></span><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>'
        + '<span class="stats"><span><b>'+(s.up&&s.ms?s.ms+' ms':s.up?'—':'caída')+'</b></span><span>24 h <b>'+fmtPct(pct(s.days||[],1))+'</b></span><span>30 d <b>'+fmtPct(pct(s.days||[],30))+'</b></span>'+ssl+'</span></div>'
        + '<div class="bars">'+bars+'</div><div class="axis"><span class="d90">hace 90 días</span><span class="d60">hace 60 días</span><span>hoy</span></div>'
        + (inc?'<div class="inc">'+inc+'</div>':'') + '</div>';
    });
    document.getElementById('list').innerHTML = html;
    document.getElementById('sum').innerHTML = down ? '<span class="dot bad"></span><span>'+(down===1?'1 web caída':down+' webs caídas')+'</span>' : '<span class="dot ok"></span><span>Todas las webs funcionan</span>';
    document.getElementById('upd').textContent = 'Última comprobación '+ago(data.updated);
  }
  function load(){
    fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(render).catch(function(){
      document.getElementById('upd').textContent = 'Aún no hay datos (la primera comprobación tarda unos minutos).';
    });
  }
  load(); setInterval(load, 60000);
})();
</script>
</body>
</html>
